<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#EAF0F6"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A4A" text-anchor="middle">سقف الرسوم القضائية (تمثيل توضيحي)</text>

  <!-- gauge arc -->
  <g transform="translate(400,270)">
    <path d="M -220,0 A 220,220 0 0 1 220,0" fill="none" stroke="#D8DFEA" stroke-width="34"/>
    <path d="M -220,0 A 220,220 0 0 1 40,-217" fill="none" stroke="#B76E42" stroke-width="34"/>
    <!-- needle pointing to ~5% mark -->
    <line x1="0" y1="0" x2="60" y2="-205" stroke="#1E2A4A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#1E2A4A"/>
    <text x="-215" y="35" font-family="Arial, sans-serif" font-size="14" fill="#4A5266">0%</text>
    <text x="195" y="35" font-family="Arial, sans-serif" font-size="14" fill="#4A5266">5%</text>
    <text x="0" y="-235" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#B76E42" text-anchor="middle">الحد الأقصى 5%</text>
  </g>

  <!-- cap note -->
  <g transform="translate(400,340)">
    <rect x="-160" y="0" width="320" height="60" rx="10" fill="#1E2A4A"/>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#EAF0F6" text-anchor="middle">بحد أقصى إجمالي</text>
    <text x="0" y="47" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#B76E42" text-anchor="middle">1,000,000 ريال سعودي للدعوى الواحدة</text>
  </g>
</svg>
