<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#1E2A4A"/>
  <text x="400" y="42" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#EAF0F6" text-anchor="middle">قسمة التركة تختلف حسب ظروف كل حالة</text>

  <!-- abstract family/heir nodes connected to a central estate node -->
  <g stroke="#B76E42" stroke-width="2" fill="none" opacity="0.7">
    <line x1="400" y1="230" x2="230" y2="120"/>
    <line x1="400" y1="230" x2="400" y2="100"/>
    <line x1="400" y1="230" x2="570" y2="120"/>
    <line x1="400" y1="230" x2="230" y2="340"/>
    <line x1="400" y1="230" x2="570" y2="340"/>
  </g>
  <!-- central estate node -->
  <circle cx="400" cy="230" r="46" fill="#B76E42"/>
  <rect x="378" y="212" width="44" height="34" rx="4" fill="#1E2A4A"/>
  <rect x="384" y="218" width="32" height="4" fill="#EAF0F6"/>
  <rect x="384" y="226" width="32" height="4" fill="#EAF0F6"/>
  <rect x="384" y="234" width="20" height="4" fill="#EAF0F6"/>

  <!-- heir nodes: plain circles, no numbers or fractions shown -->
  <g fill="#EAF0F6">
    <circle cx="230" cy="120" r="28"/>
    <circle cx="400" cy="100" r="28"/>
    <circle cx="570" cy="120" r="28"/>
    <circle cx="230" cy="340" r="28"/>
    <circle cx="570" cy="340" r="28"/>
  </g>
  <g fill="#1E2A4A" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="230" y="125">؟</text>
    <text x="400" y="105">؟</text>
    <text x="570" y="125">؟</text>
    <text x="230" y="345">؟</text>
    <text x="570" y="345">؟</text>
  </g>

  <text x="400" y="420" font-family="Arial, sans-serif" font-size="14" fill="#C4CCDC" text-anchor="middle">عدد الورثة ودرجة قرابتهم يحددان الأنصبة النظامية — لا يوجد نمط واحد يصلح لكل الحالات</text>
</svg>
