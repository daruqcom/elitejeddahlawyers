<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="100%" stop-color="#131C33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- distant skyline -->
  <g fill="#2A3A63" opacity="0.7">
    <rect x="30" y="300" width="40" height="140"/>
    <rect x="80" y="260" width="34" height="180"/>
    <rect x="700" y="270" width="46" height="170"/>
    <rect x="650" y="230" width="36" height="210"/>
  </g>
  <!-- main mixed-industry silhouette cluster -->
  <g fill="#EAF0F6">
    <!-- office tower -->
    <rect x="140" y="200" width="70" height="240"/>
    <rect x="150" y="215" width="14" height="14"/><rect x="172" y="215" width="14" height="14"/>
    <rect x="150" y="240" width="14" height="14"/><rect x="172" y="240" width="14" height="14"/>
    <rect x="150" y="265" width="14" height="14"/><rect x="172" y="265" width="14" height="14"/>
    <!-- construction crane -->
    <g stroke="#B76E42" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="250" y1="440" x2="250" y2="230"/>
      <line x1="250" y1="230" x2="330" y2="230"/>
      <line x1="250" y1="230" x2="215" y2="245"/>
      <line x1="320" y1="230" x2="320" y2="255"/>
    </g>
    <!-- twin tower -->
    <rect x="360" y="160" width="60" height="280"/>
    <rect x="430" y="190" width="50" height="250"/>
    <polygon points="360,160 390,120 420,160"/>
    <!-- port crane + container ship silhouette -->
    <g transform="translate(500,340)">
      <rect x="0" y="40" width="220" height="60" fill="#EAF0F6"/>
      <rect x="20" y="20" width="30" height="20" fill="#B76E42"/>
      <rect x="60" y="14" width="30" height="26" fill="#B76E42"/>
      <rect x="100" y="24" width="30" height="16" fill="#B76E42"/>
      <rect x="140" y="10" width="30" height="30" fill="#B76E42"/>
      <g stroke="#EAF0F6" stroke-width="4" fill="none">
        <line x1="190" y1="100" x2="190" y2="10"/>
        <line x1="190" y1="10" x2="240" y2="30"/>
      </g>
    </g>
  </g>
  <!-- route arc accent -->
  <path d="M120,90 Q400,30 690,110" stroke="#B76E42" stroke-width="1.5" fill="none" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="690" cy="110" r="4" fill="#B76E42"/>
</svg>
