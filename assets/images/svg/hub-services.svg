<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#1E2A4A"/>
  <!-- faint route arcs echoing the Gateway hero motif -->
  <g stroke="#B76E42" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M700,90 Q550,20 380,60"/>
    <path d="M700,90 Q620,220 460,260"/>
    <circle cx="700" cy="90" r="4" fill="#B76E42"/>
  </g>
  <!-- document stack -->
  <g transform="translate(230,120)">
    <rect x="40" y="60" width="220" height="270" rx="8" fill="#131C33" stroke="#3A4668"/>
    <rect x="20" y="35" width="220" height="270" rx="8" fill="#1E2A4A" stroke="#4A5578"/>
    <rect x="0" y="10" width="220" height="270" rx="8" fill="#EAF0F6"/>
    <!-- text lines on top document -->
    <rect x="24" y="40" width="140" height="10" rx="3" fill="#B76E42"/>
    <rect x="24" y="66" width="172" height="6" rx="3" fill="#B9C2D8"/>
    <rect x="24" y="86" width="172" height="6" rx="3" fill="#B9C2D8"/>
    <rect x="24" y="106" width="130" height="6" rx="3" fill="#B9C2D8"/>
    <rect x="24" y="140" width="172" height="6" rx="3" fill="#D8DFEA"/>
    <rect x="24" y="160" width="172" height="6" rx="3" fill="#D8DFEA"/>
    <rect x="24" y="180" width="100" height="6" rx="3" fill="#D8DFEA"/>
    <!-- wax seal -->
    <circle cx="170" cy="230" r="26" fill="#B76E42"/>
    <circle cx="170" cy="230" r="26" fill="none" stroke="#8f4e2c" stroke-width="2"/>
    <path d="M160,230 l7,7 l14,-16" stroke="#EAF0F6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- scales of justice, simplified line art, right side -->
  <g transform="translate(540,150)" stroke="#B76E42" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="60" y1="10" x2="60" y2="180"/>
    <line x1="10" y1="40" x2="110" y2="40"/>
    <path d="M10,40 L0,80 A25,18 0 0 0 50,80 Z" fill="#EAF0F6" stroke="#B76E42" stroke-width="3"/>
    <path d="M110,40 L100,80 A25,18 0 0 0 150,80 Z" fill="#EAF0F6" stroke="#B76E42" stroke-width="3"/>
    <line x1="30" y1="180" x2="90" y2="180"/>
  </g>
</svg>
