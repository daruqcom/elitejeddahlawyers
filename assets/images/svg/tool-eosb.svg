<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#EAF0F6"/>
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A4A" text-anchor="middle">نمو مكافأة نهاية الخدمة عبر سنوات العمل (تمثيل توضيحي)</text>
  <!-- axis -->
  <line x1="70" y1="380" x2="750" y2="380" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="70" y1="380" x2="70" y2="70" stroke="#1E2A4A" stroke-width="2"/>
  <!-- bars: years 1-5 half-month growth (rel height), 6-10 full-month growth steeper -->
  <g>
    <!-- values are illustrative relative units, not a real computation -->
    <rect x="100" y="345" width="46" height="35" fill="#B76E42"/>
    <rect x="160" y="315" width="46" height="65" fill="#B76E42"/>
    <rect x="220" y="285" width="46" height="95" fill="#B76E42"/>
    <rect x="280" y="255" width="46" height="125" fill="#B76E42"/>
    <rect x="340" y="225" width="46" height="155" fill="#B76E42"/>
    <rect x="400" y="185" width="46" height="195" fill="#1E2A4A"/>
    <rect x="460" y="145" width="46" height="235" fill="#1E2A4A"/>
    <rect x="520" y="105" width="46" height="275" fill="#1E2A4A"/>
    <rect x="580" y="65" width="46" height="315" fill="#1E2A4A"/>
  </g>
  <!-- year labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#4A5266" text-anchor="middle">
    <text x="123" y="398">1</text><text x="183" y="398">2</text><text x="243" y="398">3</text>
    <text x="303" y="398">4</text><text x="363" y="398">5</text><text x="423" y="398">6</text>
    <text x="483" y="398">7</text><text x="543" y="398">8</text><text x="603" y="398">9+</text>
  </g>
  <text x="410" y="425" font-family="Arial, sans-serif" font-size="13" fill="#4A5266" text-anchor="middle">سنوات الخدمة</text>
  <!-- legend -->
  <rect x="480" y="60" width="16" height="16" fill="#B76E42"/>
  <text x="502" y="73" font-family="Arial, sans-serif" font-size="12" fill="#1E2A4A">نصف شهر لكل سنة (أول 5 سنوات)</text>
  <rect x="480" y="84" width="16" height="16" fill="#1E2A4A"/>
  <text x="502" y="97" font-family="Arial, sans-serif" font-size="12" fill="#1E2A4A">شهر كامل لكل سنة (بعد 5 سنوات)</text>
</svg>
